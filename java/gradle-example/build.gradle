plugins {
    id 'java'
    id 'application'
}

group = 'com.example'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

ext {
    pispiQrcodeVersion = '1.0.2'
}

dependencies {
    implementation "io.github.pi-spi:bceao-pispi-qrcode:${pispiQrcodeVersion}"
}

application {
    mainClass = 'com.example.Main'
}
